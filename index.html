/* Habillage « Aniimo » : parchemin ensoleille le jour, veillee au coin du feu
   la nuit. Seules les couleurs, les formes et la typo changent -- la structure
   et les classes restent celles d'avant. */
:root{
  --bg:#fbf1e2; --bgGlow:#fff7ea; --bg2:#fffaf2; --bg3:#f4e6d2; --bg4:#ecd9be;
  --line:#e8d6bb; --line2:#f0e2cd;
  --tx:#3d3d51; --tx2:#7b6a5c; --tx3:#a89380;
  --ink:#3a2a1c;                                  /* texte pose sur une couleur */
  --chip:rgba(255,252,246,.92); --chipLine:rgba(61,61,81,.10);
  --S:#f4607f; --A:#f8943a; --B:#f0c01f; --C:#4fc39a; --D:#589fe6;
  --ok:#3fae86; --warn:#e08a2b; --bad:#e25a78; --acc:#f08a35; --acc2:#ffb866;
  --veil:rgba(61,45,30,.45);
  --sh1:0 1px 2px rgba(122,86,48,.10);
  --sh2:0 3px 10px rgba(122,86,48,.12);
  --sh3:0 10px 34px rgba(122,86,48,.20);
  --Fire:#ff7a4a; --Water:#45a9f5; --Grass:#5fc36a; --Wind:#57cdb4; --Earth:#c69455;
  --Ice:#71cdf0; --Lightning:#f5c32c; --Dark:#9b7ae0; --Light:#f3c86a;
}
html[data-theme=nuit]{
  --bg:#1d1614; --bgGlow:#2a1f19; --bg2:#271e1a; --bg3:#332721; --bg4:#40312a;
  --line:#3f302a; --line2:#332721;
  --tx:#f6e9d9; --tx2:#c6ac94; --tx3:#93795f;
  --ink:#2a1c12;
  --chip:rgba(24,17,13,.66); --chipLine:rgba(255,235,210,.08);
  --S:#ff6e8a; --A:#ffa04a; --B:#ffd24a; --C:#5fd3aa; --D:#6bb0f2;
  --ok:#5fd3aa; --warn:#ffb85c; --bad:#ff7d97; --acc:#ffa250; --acc2:#ffc98c;
  --veil:rgba(12,8,6,.62);
  --sh1:0 1px 2px rgba(0,0,0,.30);
  --sh2:0 3px 10px rgba(0,0,0,.34);
  --sh3:0 12px 36px rgba(0,0,0,.50);
  --Light:#ffe9a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
     background-image:radial-gradient(900px 520px at 12% -8%, var(--bgGlow), transparent 70%),
                      radial-gradient(760px 480px at 105% 0%, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%);
     background-attachment:fixed;
     font:15px/1.6 Nunito,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:color-mix(in srgb, var(--acc) 82%, var(--tx));text-underline-offset:2px}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:700;letter-spacing:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:var(--acc2);color:var(--ink)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ---------------------------------------------------------------- shell -- */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 88%, transparent);
       backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line);box-shadow:var(--sh1)}
.bar{max-width:1560px;margin:0 auto;padding:11px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-family:"Baloo 2",Nunito,sans-serif;font-size:21px;font-weight:800;letter-spacing:-.01em;
      white-space:nowrap;display:flex;align-items:baseline;gap:7px}
.logo b{background:linear-gradient(100deg,var(--acc),var(--S) 55%,var(--Dark));
        -webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{color:var(--tx3);font-family:Nunito,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:0}
nav{display:flex;gap:3px;background:var(--bg3);border-radius:13px;padding:4px;box-shadow:inset 0 1px 2px rgba(122,86,48,.08)}
nav button{background:none;border:0;padding:7px 15px;border-radius:10px;color:var(--tx2);
           cursor:pointer;font-size:13.5px;font-weight:700;transition:.15s}
nav button:hover{color:var(--tx);background:color-mix(in srgb, var(--bg2) 60%, transparent)}
nav button.on{background:var(--bg2);color:var(--tx);box-shadow:var(--sh1)}
.theme{margin-left:auto;background:var(--bg3);border:1px solid var(--line);border-radius:12px;
       width:36px;height:36px;font-size:16px;cursor:pointer;line-height:1;transition:.15s;box-shadow:var(--sh1)}
.theme:hover{background:var(--bg4);transform:rotate(-12deg)}
main{max-width:1560px;margin:0 auto;padding:22px 18px 90px}

/* --------------------------------------------------------------- filtres -- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
select,input[type=search]{background:var(--bg2);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;font-size:13px;font-weight:600;outline:0;box-shadow:var(--sh1);transition:.15s}
select:hover,input:hover{border-color:var(--acc2)}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent)}
input[type=search]{min-width:190px}
/* le menu des roles porte leur definition : large une fois deroule,
   mais il n'a pas a manger la barre de filtres quand il est ferme */
select#fr{max-width:250px}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 45%,var(--tx3) 45%,var(--tx3) 57%,transparent 57%),
                   linear-gradient(135deg,transparent 45%,var(--tx3) 45%,var(--tx3) 57%,transparent 57%);
  background-position:calc(100% - 18px) 54%,calc(100% - 13px) 54%;
  background-size:6px 6px;background-repeat:no-repeat}
select:hover{background-image:linear-gradient(45deg,transparent 45%,var(--acc) 45%,var(--acc) 57%,transparent 57%),
                              linear-gradient(135deg,transparent 45%,var(--acc) 45%,var(--acc) 57%,transparent 57%)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;vertical-align:-2px;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--bg3);
  border:1px solid var(--line);box-shadow:inset 0 1px 3px color-mix(in srgb,var(--tx) 14%,transparent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;
  border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--acc2),var(--acc));
  border:2px solid var(--bg2);box-shadow:var(--sh2);transition:transform .12s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.14)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.02)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--bg3);border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,var(--acc2),var(--acc));border:2px solid var(--bg2);box-shadow:var(--sh2)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--sh1)}
.seg button{background:none;border:0;padding:8px 13px;color:var(--tx2);cursor:pointer;
            font-size:12.5px;font-weight:700;border-right:1px solid var(--line);transition:.15s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--bg3);color:var(--tx)}
.seg button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc2) 42%,var(--bg2)),
                                            color-mix(in srgb,var(--acc) 26%,var(--bg2)));
  color:color-mix(in srgb,var(--acc) 62%,var(--tx));
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--acc) 60%,transparent)}
.seg button.on:hover{color:color-mix(in srgb,var(--acc) 80%,var(--tx))}
.chk{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:12.5px;font-weight:600;cursor:pointer;
     background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;box-shadow:var(--sh1)}
.chk:hover{border-color:var(--acc2);color:var(--tx)}
.chk input{accent-color:var(--acc)}
.count{color:var(--tx3);font-size:12.5px;font-weight:600;margin-left:auto}

/* ----------------------------------------------------------------- tiers -- */
.kindblk{margin-bottom:34px}
.kindhd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;padding-bottom:9px;
        border-bottom:2px dotted var(--line)}
.kindhd h2{font-size:19px}
.kindhd span{color:var(--tx3);font-size:12.5px;font-weight:600}
.row{display:grid;grid-template-columns:62px 1fr;gap:11px;margin-bottom:10px}
.tag{position:relative;overflow:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;
     font-size:34px;font-weight:800;color:var(--ink);font-family:"Baloo 2",Georgia,serif;
     text-shadow:0 1px 0 rgba(255,255,255,.40);
     box-shadow:var(--sh2),inset 0 -3px 0 rgba(0,0,0,.10),inset 0 2px 0 rgba(255,255,255,.35)}
.tag.S{background:linear-gradient(160deg,color-mix(in srgb,var(--S) 78%,#fff),var(--S))}
.tag.A{background:linear-gradient(160deg,color-mix(in srgb,var(--A) 78%,#fff),var(--A))}
.tag.B{background:linear-gradient(160deg,color-mix(in srgb,var(--B) 78%,#fff),var(--B))}
.tag.C{background:linear-gradient(160deg,color-mix(in srgb,var(--C) 78%,#fff),var(--C))}
.tag.D{background:linear-gradient(160deg,color-mix(in srgb,var(--D) 78%,#fff),var(--D))}
.tag:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 55% at 50% -12%,rgba(255,255,255,.50),transparent 62%)}
.cards{display:flex;flex-wrap:wrap;gap:8px;background:var(--bg2);border:1px solid var(--line);
       border-radius:16px;padding:9px;min-height:68px;box-shadow:var(--sh1)}
.card{position:relative;width:84px;cursor:pointer;border-radius:14px;padding:5px 4px 6px;
      background:linear-gradient(180deg,var(--bg2),color-mix(in srgb,var(--el,var(--acc)) 15%,var(--bg2)));
      border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{border-color:color-mix(in srgb,var(--el,var(--acc)) 60%,var(--line));
            transform:translateY(-4px) rotate(-1deg);
            box-shadow:0 8px 18px color-mix(in srgb,var(--el,var(--acc)) 26%,transparent)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;display:block;
          background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--el,var(--acc)) 34%,var(--bg3)),var(--bg3))}
.card .nm{font-size:10.5px;font-weight:700;line-height:1.2;text-align:center;margin-top:4px;color:var(--tx);
          height:25px;overflow:hidden;word-break:break-word}
.card .sc{position:absolute;top:7px;right:6px;background:var(--chip);border:1px solid var(--chipLine);
          border-radius:7px;padding:0 4px;font-size:9.5px;font-weight:800;color:var(--tx);
          backdrop-filter:blur(3px)}
.card .fl{position:absolute;top:7px;left:6px;display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--chip)}
.badges{position:absolute;bottom:32px;left:4px;right:4px;display:flex;gap:3px;justify-content:center}
.bd{font-size:9px;font-weight:800;border-radius:6px;padding:0 4px;line-height:14px;
    background:var(--chip);border:1px solid var(--chipLine);backdrop-filter:blur(3px)}
.bd.same{color:var(--tx3)}
.bd.ok{color:var(--ok)}
.bd.warn{color:var(--warn)}
.bd.bad{color:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--tx3);font-size:12.5px;font-weight:600;margin:-4px 0 16px}
.legend .bd{font-size:11px;padding:0 5px;margin-right:5px}
.empty{color:var(--tx3);font-size:12.5px;padding:20px;text-align:center;width:100%}

/* ---------------------------------------------------------------- table -- */
.tblcard{background:var(--bg2);border:1px solid var(--line);border-radius:18px;
  padding:4px 16px 12px;box-shadow:var(--sh2);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:9px;color:var(--tx2);font-weight:800;cursor:pointer;
   border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:58px;
   background:color-mix(in srgb, var(--bg2) 94%, transparent);backdrop-filter:blur(10px);z-index:5}
th:first-child,th:nth-child(2){text-align:left}
th:hover{color:var(--acc)}
td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line2)}
td:first-child,td:nth-child(2){text-align:left}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--bg3) 40%,transparent)}
tbody tr:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.mini{width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:9px;
      background:var(--bg3);box-shadow:0 0 0 2px var(--bg2),0 0 0 3px var(--line)}
.tpill{display:inline-block;width:21px;text-align:center;border-radius:7px;font-weight:800;
       color:var(--ink);font-size:11px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.10)}
.tpill.S{background:var(--S)}.tpill.A{background:var(--A)}.tpill.B{background:var(--B)}
.tpill.C{background:var(--C)}.tpill.D{background:var(--D)}

/* ---------------------------------------------------------------- panels -- */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;
       margin-bottom:18px;box-shadow:var(--sh2)}
.panel h2{font-size:18px;margin-bottom:4px}
.panel .sub{color:var(--tx3);font-size:12.5px;font-weight:600;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.sl{display:grid;grid-template-columns:104px 1fr 52px;gap:10px;align-items:center;margin-bottom:8px}
.sl label{color:var(--tx2);font-size:12px;font-weight:700}
.sl input[type=range]{width:100%;accent-color:var(--acc);height:16px}

/* ------------------------------------------------------- ecrans etroits -- */

<body>

<header>
  <div class="bar">
    <div class="logo">🐾 <b>Aniimo</b> <small>tier list recalculée</small></div>
    <nav id="nav"></nav>
    <div class="count" id="count"></div>
    <button class="theme" id="theme" title="Basculer jour / nuit"></button>
  </div>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div id="view"></div>
</main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script src="data.js"></script>
<script>
"use strict";
/* ========================================================== constantes == */
const STATS = ["hp","atk","pdef","mdef","brk","reg"];
const SLAB  = {hp:"PV",atk:"ATQ",pdef:"Déf.P",mdef:"Déf.M",brk:"BREAK",reg:"REGEN"};
const AXES  = META.axes;
const ALAB  = {dmg:"dégâts",team:"apport d'équipe",brk:"BREAK",sust:"survie / soin",
               res:"ressource EP",ctrl:"contrôle"};
const ELS   = ["Fire","Water","Grass","Wind","Earth","Ice","Lightning","Dark","Light"];
const ELAB  = {Fire:"Feu",Water:"Eau",Grass:"Herbe",Wind:"Vent",Earth:"Terre",Ice:"Glace",
               Lightning:"Foudre",Dark:"Ténèbres",Light:"Lumière"};
const ROLES = ["DPS","Break","Support","Regen","Heal"];
const RDESC = {DPS:"inflige les dégâts", Break:"vide la jauge de garde pour ouvrir l'ennemi",
               Support:"renforce l'équipe ou affaiblit l'ennemi", Regen:"recharge l'EP de l'équipe (pas de soin)",
               Heal:"soigne et protège (soins indexés sur les PV max)"};
const KINDS = {base:"Normaux",form:"Formes régionales",prismana:"Prismana"};
const TIERS = ["S","A","B","C","D"];
const VIEWS = {tier:"Tiers",stats:"Stats",team:"Équipe",tune:"Réglages",meth:"Méthode"};

/* ============================================================== état ==== */
const S = {
  view:"tier", kinds:["base","form","prismana"], role:"", el:"", stage:"", q:"",
  hideSame:false, sort:"score", desc:true,
  team:[null,null,null,null], picking:-1,
  safe:true,                                 // equipe auto : pas d'Aniimo "incertain"
  lock:[false,false,false,false],            // membres gardes : jamais remplaces
  around:true                                // construire autour des membres imposes
};
const clone = o => JSON.parse(JSON.stringify(o));
const WS = {                                 // poids vivants, modifiables
  mix:    clone(META.mix),
  stat:   clone(META.weights),
  kit:    clone(META.kitW),
  give:   clone(META.giveW),
  synMix: clone(META.synMix),
  condPen: META.condPen,
  model:  1                                  // multiplicateur du poids du calcul
};
const WS0 = clone(WS);

/* ====================================================== recalcul score == */
/* statParts[s] est le percentile de la stat POUSSEE (potentiel au plafond,
   couronne comprise) : la couronne est deja dans la valeur, il ne reste qu'a
   re-ponderer, donc tout est recalculable cote client. */
function sStat(r,w){
  let tot=0, det=0;
  for(const s of STATS){ tot += w[s]*r.statParts[s]/100; det += w[s]; }
  return det ? Math.min(100, tot/det*100) : 0;
}
function sKit(r,w,pen){
  let raw=0; for(const a of AXES) raw += w[a]*r.axes[a]/10;
  return Math.min(100, raw*100*(1-pen*r.cond));
}
function sSyn(r,gw,mix){
  let give=0; for(const a in gw) give += gw[a]*r.axes[a]/10;
  give = Math.min(100, give*100);
  let fit = META.fit.base;
  if(r.el.length>1) fit += META.fit.dual;
  if(r.axes.ctrl>=5 || r.axes.dmg>=7) fit += META.fit.any;
  fit = Math.min(100, fit);
  const m = mix[r.role||"DPS"];
  return Math.min(100, m*give + (1-m)*fit);
}
/* Rangs moyens (ex aequo partages), puis percentile 0..1, 1 = meilleur. */
function ranks(v){
  const o = v.map((x,i)=>i).sort((a,b)=>v[a]-v[b]), r = new Array(v.length);
  for(let i=0;i<o.length;){
    let j=i; while(j+1<o.length && v[o[j+1]]===v[o[i]]) j++;
    for(let k=i;k<=j;k++) r[o[k]] = (i+j)/2;
    i=j+1;
  }
  return r;
}
function spear(x,y){
  const rx=ranks(x), ry=ranks(y), n=x.length;
  const mx=rx.reduce((a,b)=>a+b,0)/n, my=ry.reduce((a,b)=>a+b,0)/n;
  let c=0,dx=0,dy=0;
  for(let i=0;i<n;i++){ c+=(rx[i]-mx)*(ry[i]-my); dx+=(rx[i]-mx)**2; dy+=(ry[i]-my)**2; }
  return dx&&dy ? c/Math.sqrt(dx*dy) : 0;
}
/* Normalisation par role : chaque composante recentree dans son role (moyenne 50,
   ecart-type 15), moyenne et ecart-type retrecis vers le global. */
function roleNorm(){
  const sd = (v,m) => Math.sqrt(v.reduce((a,x)=>a+(x-m)**2,0)/v.length);
  for(const [c,o] of [["_st","_nst"],["_ki","_nki"],["_sy","_nsy"]]){
    const all = ANIIMO.map(r=>r[c]), gm = all.reduce((a,b)=>a+b,0)/all.length, gs = sd(all,gm);
    for(const R of ROLES){
      const mem = ANIIMO.filter(r=>(r.role||"DPS")===R);
      const vs = mem.filter(r=>!r.same).map(r=>r[c]);
      if(!vs.length) continue;
      const n = vs.length, m = vs.reduce((a,b)=>a+b,0)/n, s = sd(vs,m) || gs, k = META.shrink;
      const m2 = (n*m + k*gm)/(n+k), s2 = (n*s + k*gs)/(n+k);
      for(const r of mem) r[o] = 50 + 15*(r[c]-m2)/s2;
    }
  }
}
/* Percentile final : le calcul pese comme une source de plus parmi les tier lists
   qui classent l'entree. `srcw` permet d'ecarter une source (validation). */
function blendOne(r, wm, srcw){
  let num = wm*r._mp, den = wm;
  for(const s in r.ext){
    const w = srcw ? srcw[s] : META.src[s].w;
    if(w===undefined) continue;
    num += w*r.ext[s][0]; den += w;
  }
  return den ? num/den : r._mp;
}
function recompute(ws){
  const w = ws||WS, sum = (w.mix.stat + w.mix.kit + w.mix.syn) || 1;
  for(const r of ANIIMO){
    const role = r.role||"DPS";
    r._st = sStat(r, w.stat[role]);
    r._ki = sKit(r, w.kit[role], w.condPen);
    r._sy = sSyn(r, w.give, w.synMix);
  }
  roleNorm();
  for(const r of ANIIMO)
    r._sc = (w.mix.stat*r._nst + w.mix.kit*r._nki + w.mix.syn*r._nsy)/sum * r.sStage;
  const rk = ranks(ANIIMO.map(r=>r._sc));
  ANIIMO.forEach((r,i)=>{ r._mp = (rk[i]+.5)/ANIIMO.length; });
  for(const r of ANIIMO){ r._fin = blendOne(r, META.modelW*w.model); r._ix = r._fin*100; }
  tiers(ANIIMO.slice());
}
/* Paliers : percentiles sur les 207 entrees, une fois pour toutes. Les filtres
   n'y touchent pas : un Aniimo garde le meme palier quoi qu'on affiche. */
function tiers(pool){
  pool.sort((a,b)=>b._fin-a._fin);
  const n = pool.length; let prev = 0;
  META.cut.forEach(function(c,i){
    const t = c[0], th = c[1];
    let end = (i===META.cut.length-1) ? n : Math.round(th*n);
    if(n>=TIERS.length) end = Math.max(end, prev+1);        // jamais de palier vide
    end = Math.min(n, Math.max(end, prev));
    // une coupure ne passe jamais entre deux notes egales : trois formes d'un
    // meme Aniimo qui partagent stats et kit ont la meme note, les separer
    // serait un artefact de la frontiere, pas un jugement.
    while(end>prev && end<n && pool[end]._fin===pool[end-1]._fin) end++;
    for(let k=prev;k<end;k++){ pool[k]._tier=t; pool[k]._rk=k+1; pool[k]._of=n; }
    prev = end;
  });
  for(let k=prev;k<n;k++){ pool[k]._tier="D"; pool[k]._rk=k+1; pool[k]._of=n; }
  return pool;
}

/* ============================================================ filtrage == */
function pass(r){
  if(S.kinds.indexOf(r.kind)<0) return false;
  if(S.role && r.role!==S.role) return false;
  if(S.el && r.el.indexOf(S.el)<0) return false;
  if(S.stage && r.stage!==S.stage) return false;
  if(S.hideSame && r.same) return false;
  if(S.q && r.name.toLowerCase().indexOf(S.q.toLowerCase())<0) return false;
  return true;
}
function kindsShown(){ return S.kinds; }
/* Une seule tier list. Le but est de composer une equipe : un Normal, une forme
   regionale et une Prismana se recrutent dans le meme vivier, donc ils se
   classent sur la meme echelle. Les rosters ne sont que des filtres. */
function pool(){ return ANIIMO.filter(pass).sort((a,b)=>b._fin-a._fin); }
const SRCN = {game8:"Game8", aniimoguide:"Aniimo Guide", mobi:"Mobi.gg", allthings:"AllThings.How",
              kongbakpao:"KongBakPao", powerup:"PowerUp Gaming"};
const CONF = {
  sur:       {i:"✔", l:"sûr",       c:"ok",   d:"Garde ce palier dans au moins 75 % des tirages, et au moins deux tier lists l'ont classé."},
  probable:  {i:"≈", l:"probable",  c:"warn", d:"À cheval entre deux paliers : l'ordre de grandeur est fiable, la lettre exacte moins."},
  incertain: {i:"?", l:"incertain", c:"bad",  d:"Aucune tier list ne l'a classé (seul le calcul parle), ou ses tirages s'étalent sur trois paliers."}
};
const confTip = r => `Confiance : ${CONF[r.conf].l} — garde son palier dans ${r.keep} % des ${META.runs} tirages`
  + (r.span.length>1 ? `, se situe entre ${r.span[0]} et ${r.span[r.span.length-1]}` : "")
  + `. ${Object.keys(r.ext).length} tier list${Object.keys(r.ext).length>1?"s":""} sur 6 le classe${Object.keys(r.ext).length>1?"nt":""}.`;
const byName = {}; ANIIMO.forEach(r=>{ byName[r.name]=r; });
const img = n => "images/"+encodeURIComponent(n)+".png";
const fam = n => (n||"").replace(/^Prismana /,"");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================ rendu UI == */
function navHTML(){
  return Object.keys(VIEWS).map(k=>
    `<button class="${S.view===k?"on":""}" data-v="${k}">${VIEWS[k]}</button>`).join("");
}
function filtersHTML(){
  if(S.view==="meth") return "";
  const all = S.kinds.length===Object.keys(KINDS).length;
  const seg = Object.keys(KINDS).map(k=>
      `<button class="${S.kinds.indexOf(k)>=0?"on":""}" data-k="${k}"
        title="Afficher ou retirer ce groupe de la tier list">${KINDS[k]}</button>`).join("")
    + `<button class="${all?"on":""}" data-k="all" title="Tout remettre">Tous</button>`;
  const opt = (v,l,cur)=>`<option value="${v}"${cur===v?" selected":""}>${l}</option>`;
  const base = `
   <select id="fr">${opt("","Tous rôles",S.role)}${ROLES.map(r=>opt(r,r+" — "+RDESC[r],S.role)).join("")}</select>
   <select id="fe">${opt("","Tous éléments",S.el)}${ELS.map(e=>opt(e,ELAB[e],S.el)).join("")}</select>
   <select id="fs">${opt("","Tous stades",S.stage)}${["Nova","Gamma","Lumin"].map(s=>opt(s,s,S.stage)).join("")}</select>
   <label class="chk"><input type="checkbox" id="fh"${S.hideSame?" checked":""}>
     Masquer les formes identiques</label>
   <input type="search" id="fq" placeholder="Rechercher…" value="${esc(S.q)}">`;
  if(S.view==="tune") return base;
  return `<div class="seg" id="segk">${seg}</div>` + base;
}
function cardHTML(r){
  const dots = r.el.map(e=>`<i class="dot" style="background:var(--${e})" title="${ELAB[e]}"></i>`).join("");
  const bd = [];
  if(r.same) bd.push(`<i class="bd same" title="Identique à ${esc(r.parent)}">=</i>`);
  bd.push(`<i class="bd ${CONF[r.conf].c}" title="${esc(confTip(r))}">${CONF[r.conf].i}</i>`);
  return `<div class="card" data-n="${esc(r.name)}" style="--el:var(--${r.el[0]||"Fire"})">
    <div class="fl">${dots}</div><div class="sc" title="Indice final sur 100">${r._ix.toFixed(0)}</div>
    <img src="${img(r.name)}" alt="" loading="lazy">
    ${bd.length?`<div class="badges">${bd.join("")}</div>`:""}
    <div class="nm">${esc(r.name)}</div></div>`;
}
function viewTier(){
  const P = pool();
  if(!P.length) return '<div class="empty">Aucun Aniimo ne correspond aux filtres.</div>';

  let h = `<div class="kindblk"><div class="kindhd"><h2>Classement général</h2>

      g.length ? g.map(cardHTML).join("") : '<div class="empty">—</div>'}</div></div>`;
  }
  return h + "</div>";
}

/* ====================================================== note d'équipe === */
const AXT = {dmg:8,team:6,brk:7,sust:6,res:6,ctrl:5};        // seuils de couverture
const AXW = {dmg:.28,team:.20,brk:.20,sust:.14,res:.10,ctrl:.08};
const TW  = {power:.30, axes:.30, el:.12, role:.13, combo:.15};

/* Un duo nomme est-il reuni ? Renvoie les indices des membres qui le forment. */
function duoUse(d, names){
  const used=[];
  for(const g of d.need){
    let i=-1;
    for(let j=0;j<names.length;j++)
      if(g.indexOf(names[j])>=0 && (!d.distinct || used.indexOf(j)<0)){ i=j; break; }
    if(i<0) return null;
    used.push(i);
  }
  return used;
}
/* Un sort qui ne sert qu'un element allie (Nebula Burst : degats Tenebres ;
   Lightning Surge : allies Foudre) n'a sa pleine valeur que si un allie porte cet
   element. equipEl.vars donne la meilleure paire pour chaque jeu d'elements presents ;
   on essaie celles que l'equipe autorise et on garde la meilleure note.
   T.eq donne, par emplacement, les deux sorts a equiper dans CETTE equipe. */
function teamScore(mem){
  const opts = mem.map((r,i)=>{
    if(!r || !r.equipEl) return [null];
    const has = e => mem.some((o,j)=>o && j!==i && o.el.indexOf(e)>=0);
    return r.equipEl.vars.filter(v=>v.need.every(has)).map(v=>Object.assign({}, v,
      {uses: v.equip.filter(n=>r.equipEl.locks[n] && has(r.equipEl.locks[n]))}));
  });
  let best = null;
  const pick = (i, cur)=>{
    if(i===mem.length){
      const mm = mem.map((r,k)=>cur[k] ? Object.assign(Object.create(r),
        {axes:cur[k].axes, equip:cur[k].equip, _elw:cur[k].uses}) : r);
      const T = teamScore0(mm);
      if(T && (!best || T.note>best.note+1e-9)){ best = T; best.eq = mm.map(r=>r && r.equip); }
      return;
    }
    for(const v of opts[i]) pick(i+1, cur.concat([v]));
  };
  pick(0, []);
  return best;
}
function teamScore0(mem){
  const m = mem.filter(Boolean);
  if(!m.length) return null;
  const up=[], dn=[];

  /* 1. puissance individuelle moyenne : l'indice final, sur 100 */
  const power = m.reduce((a,r)=>a+r._ix,0)/m.length;
  for(const r of m) if(r.conf==="incertain")
    dn.push(`La place de <b>${esc(r.name)}</b> est incertaine : ${Object.keys(r.ext).length ? "ses tirages s'étalent sur trois paliers" : "aucune tier list ne l'a classé, seul le calcul parle"}.`);
  if(m.length>=3 && m.every(r=>r.conf==="sur"))
    up.push(`Les ${m.length} membres ont un palier <b>sûr</b> : pas de pari dans cette équipe.`);

  /* 2. couverture des six axes : le meilleur porteur, plus 40 % du second,
        parce qu'une redondance aide un peu mais ne double pas l'effet. */
  let axes=0; const axd={};
  for(const a of AXES){
    const v = m.map(r=>r.axes[a]).sort((x,y)=>y-x);
    const eff = v[0] + .4*(v[1]||0);
    const sc = Math.min(1, eff/AXT[a]);
    axd[a] = {eff:eff, sc:sc};
    axes += AXW[a]*sc;
  }
  axes *= 100;
  for(const a of AXES){
    if(axd[a].sc < .45)
      dn.push(`Axe <b>${ALAB[a]}</b> presque absent : ${axd[a].eff.toFixed(1)} sur ${AXT[a]} attendus.`);
    else if(axd[a].sc >= 1 && AXW[a] >= .2)
      up.push(`Axe <b>${ALAB[a]}</b> pleinement couvert.`);
  }

  /* 3. éléments */
  const els = Array.from(new Set([].concat.apply([], m.map(r=>r.el))));
  const el = Math.min(1, els.length/5)*100;
  if(els.length>=4) up.push(`<b>${els.length} éléments</b> couverts : peu de contenus vous prendront à défaut.`);
  if(els.length<=2 && m.length>=3)
    dn.push(`Seulement <b>${els.length} élément${els.length>1?"s":""}</b> : l'équipe s'effondre face à une résistance adverse.`);

  /* 4. rôles */
  const rl = Array.from(new Set(m.map(r=>r.role).filter(Boolean)));
  const role = Math.min(1, rl.length/3)*100;
  if(rl.length>=3) up.push(`<b>${rl.length} rôles</b> distincts : la composition se tient toute seule.`);
  if(rl.length===1 && m.length>=3) dn.push(`Les ${m.length} membres partagent le rôle <b>${rl[0]}</b>.`);

  /* 5. combos nommés lus dans les kits, et affinités élémentaires */
  let combo = 35;
  const names = m.map(r=>fam(r.kitWho));
  for(const d of META.duos){
    const used = duoUse(d, names);
    if(used){
      combo += d.pts;
      up.push(`Duo <b>${used.map(i=>esc(m[i].name)).join(" + ")}</b> — ${esc(d.why)}`);
    }
  }
  for(let i=0;i<m.length;i++){
    const L = META.lock[fam(m[i].kitWho)];
    if(!L) continue;
    const n = m.filter((r,j)=>j!==i && r.el.indexOf(L)>=0).length;
    if(n){
      combo += Math.min(2,n)*7;
      up.push(`<!--k:lock${esc(m[i].name)}--><b>${esc(m[i].name)}</b> amplifie l'élément ${ELAB[L]} : ${n} allié${n>1?"s en profitent":" en profite"}.`);
    } else if(m[i].axes.team>=5){
      dn.push(`L'apport de <b>${esc(m[i].name)}</b> est verrouillé sur ${ELAB[L]}, et personne d'autre ne porte cet élément.`);
    }
  }
  /* Pawney (toutes formes : Snowfield Pawney a son propre kitWho) : Pursuit donne +30 %
     sur cible controlee OU en BREAK, son ultime +30 % sur cible en BREAK seulement.
     Un briseur ouvre les deux ; un controleur, Pursuit seul ; un sommeil qui saute au
     premier coup (Somniwing) n'ouvre qu'une frappe. */
  const paw = m.filter(r=>/Pawney$/.test(r.kitWho));
  const kitTxt = r => r.skills.concat(r.innate, r.traits).map(t=>t.d).join(" ");
  const fragile = r => /removed when the target takes damage/i.test(kitTxt(r))
    && !/stun|freez|petrif|bind|root|pull|knock|suppress|immobil|paraly/i.test(kitTxt(r));
  const breaker = r => paw.indexOf(r)<0 && (r.role==="Break" || r.axes.brk>=7);
  const ctrler  = r => paw.indexOf(r)<0 && !breaker(r) && r.axes.ctrl>=6;
  const opener  = r => breaker(r) || ctrler(r);
  const nm = rs => rs.map(r=>"<b>"+esc(r.name)+"</b>").join(" et ");
  if(paw.length && m.some(opener)){
    const B = m.filter(breaker), C = m.filter(ctrler);
    const Cs = C.filter(r=>!fragile(r)), Cf = C.filter(fragile);
    combo += B.length ? 10 : Cs.length ? 5 : 2;
    up.push(`<!--k:paw-->` + (B.length
      ? `${nm(B)} ${B.length>1?"brisent":"brise"} la garde : les deux +30 % de <b>${esc(paw[0].name)}</b>
         s'appliquent (Pursuit et ultime).`
      : `<b>${esc(paw[0].name)}</b> profite de Pursuit (+30 % sur cible contrôlée).`)
      + (Cs.length ? ` ${nm(Cs)} ${B.length?"ajoute":"apporte"} du contrôle qui déclenche aussi Pursuit.` : "")
      + (Cf.length ? ` Le sommeil de ${nm(Cf)} saute au premier coup : il n'ouvre qu'une frappe.` : ""));
    if(!B.length) dn.push(`<!--k:pawbrk-->Personne ne brise pour <b>${esc(paw[0].name)}</b> : le +30 % de son ultime
      (cible en BREAK seulement) ne sert pas.`);
  }
  /* Buff collectif sans verrou d'element (Turbo, Glacy) : il sert chaque porteur
     de degats, quel que soit son element. */
  for(const b of m){
    if(b.axes.team<8 || META.lock[fam(b.kitWho)]) continue;
    const car = m.filter(r=>r!==b && (r.role==="DPS" || r.axes.dmg>=7));
    if(!car.length) continue;
    combo += 5*Math.min(2, car.length);
    up.push(`<!--k:buff${esc(b.name)}-->Le buff collectif de <b>${esc(b.name)}</b>, sans verrou d'élément, profite à
      ${car.map(r=>"<b>"+esc(r.name)+"</b>").join(", ")}.`);
  }
  for(const b of m.filter(r=>r._elw && r._elw.length)){
    for(const E of [...new Set(b._elw.map(n=>b.equipEl.locks[n]))]){
      if(META.lock[fam(b.kitWho)]===E) continue;   // deja compte par "amplifie l'element"
      const al = m.filter(r=>r!==b && r.el.indexOf(E)>=0);
      combo += 4*Math.min(2, al.length);
      up.push(`<!--k:elw${esc(b.name+E)}-->Avec <b>${b._elw.filter(n=>b.equipEl.locks[n]===E).map(esc).join(" + ")}</b>,
        <b>${esc(b.name)}</b> soutient ses alliés ${ELAB[E]} : ${al.map(r=>"<b>"+esc(r.name)+"</b>").join(", ")}.`);
    }
  }
  for(const b of m.filter(r=>r.ultEl && META.lock[fam(r.kitWho)]!==r.ultEl)){
    const al = m.filter(r=>r!==b && r.el.indexOf(b.ultEl)>=0);
    if(!al.length) continue;
    combo += 3*Math.min(2, al.length);
    up.push(`<!--k:ult${esc(b.name)}-->L'ultime de <b>${esc(b.name)}</b> augmente les dégâts ${ELAB[b.ultEl]} de
      ${al.map(r=>"<b>"+esc(r.name)+"</b>").join(", ")}.`);
  }
  combo = Math.min(100, combo);

  /* 6. règles : ce sont des manques structurels, donc un malus direct */
  let malus = 0;
  const R = {}; META.rules.forEach(r=>{ R[r.id]=r; });
  const has = f => m.some(f);
  if(paw.length && !m.some(opener)){
    malus += R.breaker.pts; dn.push(esc(R.breaker.why));
  }
  if(!has(r=>r.axes.res>=5)){ malus += R.ep.pts; dn.push(esc(R.ep.why)); }
  if(!has(r=>r.axes.brk>=5 || r.role==="Break")){ malus += R["break"].pts; dn.push(esc(R["break"].why)); }
  if(!has(r=>r.axes.sust>=5 || r.role==="Heal")){ malus += R.sust.pts; dn.push(esc(R.sust.why)); }

  const note = Math.max(0, Math.min(100,
    TW.power*power + TW.axes*axes + TW.el*el + TW.role*role + TW.combo*combo - malus));
  const grade = note>=80?"S":note>=70?"A":note>=58?"B":note>=45?"C":"D";
  return {note,grade,power,axes,el,role,combo,malus,up,dn,els,rl,axd,n:m.length};
}
/* Une famille = une espece : Hexxin, Mountain Hexxin et Prismana Hexxin ne se
   cumulent pas dans une composition automatique. */
const famKey = r => fam(r.parent||r.name);
function candidates(team, slot){
  const fams = new Set(team.filter((r,i)=>r && i!==slot).map(famKey));
  return ANIIMO.filter(r=>pass(r) && (!S.safe || r.conf!=="incertain") && !team.some(x=>x && x.name===r.name)
    && (!fams.has(famKey(r)) || selfDuo(r)));
}
/* Exception : un kit qui n'agit qu'avec un deuxieme membre de sa famille (Chirpi). */
function selfDuo(r){
  const n = fam(r.kitWho);
  return META.duos.some(d=>d.distinct && d.need.every(g=>g.indexOf(n)>=0));
}
const noteOf = team => { const t = teamScore(team); return t ? t.note : 0; };
/* Ce qui fait fonctionner les Aniimo imposes : les dependances nommees de leur
   kit (Bouldus a besoin de Waleetle) et l'element sur lequel leur apport est
   verrouille (Sparki ne sert qu'aux allies Feu). Dans la note d'equipe ces
   points sont dilues ; quand on construit AUTOUR d'un choix, ils passent devant
   la puissance brute des autres candidats. */
const FITK = 1;
function serveKept(team, kept){
  if(!kept.length) return 0;
  const m = team.filter(Boolean), names = m.map(r=>fam(r.kitWho));
  let b = 0;
  for(const d of META.duos){
    const used = duoUse(d, names);
    if(used && used.some(i=>kept.indexOf(m[i])>=0)) b += d.pts;
  }
  for(const k of kept){
    const L = META.lock[fam(k.kitWho)]; if(!L) continue;
    b += Math.min(2, m.filter(r=>r!==k && r.el.indexOf(L)>=0).length)*7;
  }
  return b;
}
const objOf = (team, kept) => noteOf(team) + (S.around ? FITK*serveKept(team, kept) : 0);
/* Composition : les emplacements `fixed` ne bougent pas. Les autres sont remplis
   un par un (le candidat qui monte le plus la note), puis re-essayes tant qu'un
   echange ameliore encore l'ensemble : le glouton seul se laisse pieger par son
   premier choix. */
function build(fixed){
  const team = S.team.map((r,i)=> fixed.indexOf(i)>=0 ? r : null);
  const kept = team.filter(Boolean);
  const free = [0,1,2,3].filter(i=>!team[i]);
  for(const i of free){
    let best=null, bs=-Infinity;
    for(const c of candidates(team,i)){ team[i]=c; const n=objOf(team,kept); if(n>bs){ bs=n; best=c; } }
    team[i]=best;
  }
  let cur = objOf(team,kept);
  for(let it=0; it<6; it++){
    let moved=false;
    for(const i of free){
      const keep=team[i]; let best=keep, bs=cur;
      for(const c of candidates(team,i)){ team[i]=c; const n=objOf(team,kept); if(n>bs+1e-9){ bs=n; best=c; } }
      team[i]=best;
      if(best!==keep){ moved=true; cur=bs; }
    }
    if(!moved) break;
  }
  S.team = team;
}
/* Ce qu'un changement apporte : manques combles, points gagnes, points perdus,
   nouveaux trous. Les lignes sont celles de teamScore, comparees avant/apres. */
function why(before, after, inc, out){
  const B = before || {up:[],dn:[]}, o=[];
  let fixed = B.dn.filter(x=>after.dn.indexOf(x)<0);
  let gain  = after.up.filter(x=>B.up.indexOf(x)<0);
  let lost  = B.up.filter(x=>after.up.indexOf(x)<0);
  let added = after.dn.filter(x=>B.dn.indexOf(x)<0);
  // un manque qui persiste avec un autre chiffre ("2.0 sur 8" -> "3.5 sur 8") reste un manque
  const dk = x => x.replace(/\d+(\.\d+)?/g,"#");
  added = added.filter(a=>{ const f=fixed.find(x=>dk(x)===dk(a)); if(!f) return true; fixed=fixed.filter(x=>x!==f); return false; });
  // "4 rôles distincts" devenu "3 rôles distincts" : une seule ligne, dans le bon sens
  // une synergie nommee (<!--k:..-->) qui reste en place n'est pas un changement
  const tag = x => (x.match(/^<!--k:(.*?)-->/)||[])[1];
  const key = x => tag(x) || x.replace(/\d+(\.\d+)?/g,"#");
  const num = x => parseFloat((x.match(/\d+(\.\d+)?/)||[0])[0]);
  const moved = [];
  gain = gain.filter(g=>{
    const l = lost.find(x=>key(x)===key(g));
    if(!l) return true;
    lost = lost.filter(x=>x!==l);
    if(!tag(g) && num(g)!==num(l)) moved.push([num(g)>num(l)?"up":"dn", g]);
    return false;
  });
  fixed.forEach(x=>o.push(`<div class="li up">Comble : ${x}</div>`));
  gain.forEach(x=>o.push(`<div class="li up">${x}</div>`));
  moved.forEach(x=>o.push(`<div class="li ${x[0]}">Désormais : ${x[1]}</div>`));
  lost.forEach(x=>o.push(`<div class="li dn">Perd : ${x}</div>`));
  added.forEach(x=>o.push(`<div class="li dn">${x}</div>`));
  if(out){
    const d = inc._ix - out._ix;
    if(Math.abs(d)>=3)
      o.push(`<div class="li ${d>0?"up":"dn"}">Puissance individuelle : ${out._ix.toFixed(0)} → ${inc._ix.toFixed(0)}
        (${inc._tier}, ${CONF[inc.conf].l}).</div>`);
  } else {
    o.push(`<div class="li up">Palier <b>${inc._tier}</b>, indice ${inc._ix.toFixed(0)}, ${CONF[inc.conf].l} —
      ${inc.role||"—"} (${RDESC[inc.role||"DPS"]}), ${inc.el.map(e=>ELAB[e]).join("/")}.</div>`);
  }
  return o.join("");
}
function suggestHTML(T){
  if(!T) return "";
  const empty = S.team.indexOf(null);
  // incomplete : on complete TOUS les presents ; pleine : seuls les gardes sont imposes
  const kept = empty>=0 ? S.team.filter(Boolean) : S.team.filter((r,i)=>r && S.lock[i]);
  const o0 = objOf(S.team,kept), s0 = serveKept(S.team,kept);
  const mk = (i,c,team) => { const t=teamScore(team);
    return {i, c, t, d:t.note-T.note, o:objOf(team,kept)-o0, sv:serveKept(team,kept)-s0}; };
  const sug = [];
  if(empty>=0){                                   // equipe incomplete : meilleurs ajouts
    const team = S.team.slice();
    for(const c of candidates(team,empty)){ team[empty]=c; sug.push(mk(empty,c,team)); }
  } else {                                        // equipe pleine : meilleurs echanges
    for(let i=0;i<4;i++){
      if(S.lock[i]) continue;
      const team = S.team.slice(), per=[];
      for(const c of candidates(team,i)){ team[i]=c; const x=mk(i,c,team); if(x.o>=.5) per.push(x); }
      per.sort((a,b)=>b.o-a.o); sug.push.apply(sug, per.slice(0,3));
    }
  }
  sug.sort((a,b)=>b.o-a.o);
  const seen=new Set(), top=[];
  for(const s of sug){
    const k=famKey(s.c); if(seen.has(k)) continue;
    seen.add(k); top.push(s); if(top.length>=5) break;
  }
  const head = empty>=0
    ? `<h2>Qui ajouter à l'emplacement ${empty+1} ?</h2><div class="sub">Les 5 candidats qui donnent la meilleure
        note à l'équipe telle qu'elle est, et ce que chacun apporte.</div>`
    : `<h2>Changements conseillés</h2><div class="sub">Remplacements qui améliorent l'équipe, membres gardés exclus.
        ${S.lock.some(Boolean)?"":"Clique « garder » sur un membre pour qu'il ne soit jamais proposé au remplacement."}</div>`;
  if(!top.length) return `<div class="panel">${head}<div class="note">Aucun changement ne fait gagner au moins
    un demi-point : cette équipe est au mieux de ce que permettent les filtres et les membres gardés.</div></div>`;
  return `<div class="panel">${head}${top.map(s=>{
    const out = S.team[s.i];
    return `<div style="display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)">
      <img src="${img(s.c.name)}" alt="" style="width:54px;height:54px;border-radius:8px;object-fit:cover;background:var(--bg3);flex:none">
      <div style="flex:1;min-width:0">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">

/* ============================================= validation hors source == */
/* Pour chaque source s : l'indice est recalcule SANS elle (poids des autres
   re-estimes sans elle, META.wLoo[s]) et compare a son classement. */
function validate(){
  const out = {}, wm = META.modelW*WS.model;
  for(const s in META.src){
    const rs = ANIIMO.filter(r=>r.ext[s] && !r.ext[s][2]);
    const truth = rs.map(r=>r.ext[s][0]);
    out[s] = {n:rs.length,
              model: spear(rs.map(r=>r._mp), truth),
              final: spear(rs.map(r=>blendOne(r, wm, META.wLoo[s])), truth),
              peers: META.valid[s].peers};
  }
  return out;
}
function validHTML(){
  const v = validate(), ks = Object.keys(v);
  const avg = k => ks.reduce((a,s)=>a+v[s][k],0)/ks.length;
  const bar = x => `<span style="display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--bg3);
    vertical-align:middle;margin-right:6px"><span style="display:block;height:6px;border-radius:3px;
    width:${Math.max(0,x)*100}%;background:var(--acc)"></span></span>${x.toFixed(2)}`;
  return `<table style="width:100%"><thead><tr><th style="text-align:left">Tier list cachée</th><th>Entrées</th>
      <th title="Le calcul seul, sans aucune tier list">Calcul seul</th>
      <th title="Le calcul mélangé aux 5 autres tier lists">Indice final</th>
      <th title="Les 5 autres tier lists entre elles, sans le calcul : l'accord entre experts">Les autres experts</th></tr></thead>
    <tbody>${ks.map(s=>`<tr><td style="text-align:left"><a href="https://${META.src[s].url}" target="_blank" rel="noopener">${esc(SRCN[s])}</a></td>
      <td>${v[s].n}</td><td>${bar(v[s].model)}</td><td>${bar(v[s].final)}</td><td>${bar(v[s].peers)}</td></tr>`).join("")}
      <tr style="font-weight:700"><td style="text-align:left">Moyenne</td><td></td>
      <td>${avg("model").toFixed(2)}</td><td>${avg("final").toFixed(2)}</td><td>${avg("peers").toFixed(2)}</td></tr>
    </tbody></table>
    <div class="note">Lecture : si « Indice final » ≈ « Les autres experts », l'indice devine une tier list
      aussi bien que les experts se devinent entre eux. Les experts ne sont d'accord qu'à 0,45–0,78 :
      aucun classement ne peut viser 1,00.</div>`;
}

function viewMeth(){
  const SRCW = Object.entries(META.src).sort((a,b)=>b[1].w-a[1].w);
  const nconf = k => ANIIMO.filter(r=>r.conf===k).length;
  return `<div class="meth">

  permet</b> : niveau, Résonance, potentiel, Points et Fruit de Capacité, Rangs d'Attribut. Ce
  plafond étant identique pour tous, le classement se joue sur ce qui diffère réellement — les
  stats de base, la marge de croissance des stats couronnables, et le kit.</p>
  <p><code>score = (${(WS.mix.stat*100).toFixed(0)} % × stats + ${(WS.mix.kit*100).toFixed(0)} % × kit

  <h2>Les stats, et le fait que deux exemplaires n'ont pas les mêmes</h2>
  <p>Deux exemplaires d'un même Aniimo ne sortent pas avec les mêmes statistiques : à la capture, le

  ${META.pot.grades.map(g=>`${g[0]} ${g[1]} %`).join(" · ")}. Ce potentiel se monte ensuite à
  l'Éveil d'aptitude contre de la Poussière d'étoile, inné et acquis partageant le même plafond :
  <b>${META.pot.cap} points</b> par statistique, <b>${META.pot.capFav}</b> sur les deux statistiques
  que le jeu recommande une fois l'Ascension de résident passée — celles que porte l'icône couronne,
  et celles auxquelles le Capafruit ajoute son point. Chaque point vaut <b>+4 %</b> de la statistique.</p>
  <p>Cette tier list se place sur l'<b>exemplaire parfait</b> : tout le monde est à son plafond, donc
  ×${META.pot.grow.toFixed(2)} sur une statistique ordinaire et ×${META.pot.growFav.toFixed(2)} sur une
  statistique couronnée. La couronne vaut donc <b>+${((META.crown-1)*100).toFixed(1)} %</b> — et non les
  +20 % que suggère le rapport ${META.pot.capFav}/${META.pot.cap}, erreur que portaient les versions
  précédentes. Ce sont ces valeurs poussées qui sont normalisées en percentile sur tout le roster,
  puis pondérées par rôle : un DPS vit de son Attaque, un Regen de sa Régénération.</p>
  <p>Quelles statistiques sont couronnables ? <b>Le jeu le dit par Aniimo, pas par rôle</b> — et il le
  publie pour ${META.pot.nReco} entrées sur ${META.n.base+META.n.form+META.n.prismana}. Pour les
  autres, on retombe sur les deux statistiques que le jeu recommande le plus souvent
  <i>dans le même rôle</i>, comptées sur les fiches où il les a réellement publiées
  (${Object.entries(META.fav).map(([k,v])=>`${k} ${v.map(x=>SLAB[x]).join("+")}`).join(" · ")}).
  La fiche de chaque Aniimo dit laquelle des deux situations s'applique. Les statistiques couronnables
  apparaissent en vert dans la vue Stats.</p>
  <p>Un second tirage a lieu à la capture, la <b>personnalité</b> (16 types, quatre créneaux de deux
  lettres). Il se rejoue au Fruit de psyché : sur l'exemplaire parfait, c'est donc un choix, pas un
  tirage. Il n'entre volontairement pas dans le calcul — le meilleur choix est le même pour tous les
  Aniimo d'un rôle, or la note de stat est normalisée par rôle, un bonus uniforme s'y annulerait
  exactement — mais il fait partie de la forme parfaite à viser, et la fiche de chaque Aniimo indique

  <table class="tbl"><thead><tr><th>Créneau</th><th>Première lettre</th><th>Seconde lettre</th></tr></thead>
  <tbody>${META.pot.perso.map((c,i)=>`<tr><td>${i+1}</td>${c.map(x=>
    `<td><b>${x[0]}</b> ${x[1]} — ${x[2]}</td>`).join("")}</tr>`).join("")}</tbody></table>

  <h2>Le kit : ${META.nKits} lectures à la main</h2>
  <p>C'est ici que ce classement se sépare d'une extraction automatique. Les ${META.nKits} kits
  distincts du roster ont été <b>lus un par un</b> — traits, compétences innées, compétences de
  combat, ultime — puis notés de 0 à 10 sur six axes, selon une grille fixe écrite <i>avant</i> la
  lecture et conservée dans <code>RUBRIC.md</code> :</p>
  <ul>${AXES.map(a=>`<li><b>${ALAB[a]}</b></li>`).join("")}</ul>
  <p>S'y ajoute une <b>conditionnalité</b> de 0 à 3 : un kit qui exige des cumuls, un placement ou un
  allié précis vaut moins qu'un kit qui s'applique tout seul. Chaque palier retire
  ${(META.condPen*100).toFixed(0)} % du score de kit, ${(META.condPen*300).toFixed(0)} % au pire.
  Les notes sont <b>absolues</b> et non relatives au roster : elles ne bougent pas si le roster
  change. Les formes régionales qui réutilisent le kit de leur base en héritent.</p>

  <h2>La synergie</h2>
  <p>Ce que l'Aniimo apporte à une équipe plutôt qu'à lui-même : la part collective de ses six axes,
  et sa facilité d'insertion (conditionnalité, bi-élément, forme finale, mobilité d'exploration). Le
  mélange dépend du rôle — un Support est jugé à ${(META.synMix.Support*100).toFixed(0)} % sur ce
  qu'il donne, un DPS à ${(META.synMix.DPS*100).toFixed(0)} % seulement.</p>

  <h2>Les trois rosters, une seule tier list</h2>
  <p>Chaque version du jeu est une entrée à part entière, mais elles sont classées
  <b>ensemble</b>, sur une échelle unique. La raison est le but recherché : on compose une
  équipe de quatre, et un Normal, une forme régionale et une Prismana se recrutent dans le même
  vivier. Les séparer reviendrait à comparer chacun à ses semblables au lieu de le comparer à
  ses concurrents réels — une Prismana pouvait alors se retrouver classée sous sa propre base à
  score égal. Les trois puces du bandeau sont donc des <b>filtres cumulables</b> : elles
  retirent ou remettent un groupe dans le classement, elles ne le découpent pas.</p>
  <ul>
    <li><b>Normaux</b> — ${META.n.base} Aniimo de base.</li>
    <li><b>Formes régionales</b> — ${META.n.form} variantes.

      strictement identiques à leur base sur tout ce qui est mesuré : mêmes stats, même kit, mêmes
      éléments, même rôle. Elles portent un <i class="bd same">=</i> et le filtre « Masquer les
      formes identiques » les retire. Les autres changent d'élément, de stats ou de rôle.</li>
    <li><b>Prismana</b> — ${META.n.prismana} formes Prismana, avec leurs stats et leurs kits propres.
      ${ANIIMO.filter(r=>r.kind==="prismana"&&r.same).length} d'entre elles portent aussi le
      <i class="bd same">=</i> : leur fiche est rigoureusement celle de leur base, la forme Prismana
      n'apporte rien de mesurable.</li>
  </ul>

  <h2>L'échelle des paliers</h2>
  <p>Les paliers sont des <b>percentiles</b>
  (${META.cut.slice(0,4).map(x=>(x[1]*100).toFixed(0)+" %").join(" / ")}) découpés sur le vivier
  affiché : une position relative, pas une puissance absolue. Sans filtre, c'est donc une découpe
  sur les ${META.n.base+META.n.form+META.n.prismana} entrées, et les Prismana y remontent
  d'elles-mêmes — ce sont des versions améliorées d'Aniimo déjà corrects, leur médiane est plus
  haute :
  ${(function(){const P=tiers(ANIIMO.slice());
    return TIERS.map(t=>t+" "+P.filter(r=>r.kind==="prismana"&&r._tier===t).length).join(" · ");})()}.</p>
  <p>Restreindre le vivier avec un filtre le redécoupe : un palier répond toujours à la question
  « où se situe cet Aniimo <i>parmi ceux qui sont affichés</i> ». Le score, lui, ne bouge pas.</p>

  <h2>Le consensus des tier lists publiées</h2>
  <p>Tout ce qui précède ne produit qu'un avis : le mien. Le nombre affiché sur les cartes n'est pas
  cet avis, c'est l'<b>indice final</b> — ce calcul croisé avec ${SRCW.length} tier lists publiées.
  Chacune est d'abord ramenée en <b>percentiles</b>, parce qu'un T0,5 sur sept niveaux et un S sur
  cinq ne racontent pas la même chose. Chacune reçoit ensuite un poids : son accord de rangs avec
  l'ensemble des autres. Une liste qui suit le consensus pèse plus qu'une liste isolée, sans que
  personne ait à décréter laquelle a raison.</p>
  <table class="wait src"><thead><tr><th>Tier list</th><th>Aniimo classés</th><th>Niveaux</th><th>Poids</th></tr></thead>
  <tbody>${SRCW.map(([k,v])=>`<tr>
    <td><b><a href="https://${v.url}" target="_blank" rel="noopener">${esc(SRCN[k])}</a></b></td>
    <td>${v.n}</td><td>${v.levels.join(" · ")}</td><td>${v.w.toFixed(2)}</td></tr>`).join("")}
  </tbody></table>
  <p>Le calcul entre dans ce mélange comme une source de plus, au poids <b>${META.modelW.toFixed(2)}</b> :
  il est d'accord ${Math.sqrt(META.modelW).toFixed(2)} avec le consensus, et ce sont ces accords, mis
  au carré, qui font les poids. Concrètement il pèse à peu près comme la tier list la mieux notée, et
  il n'écrase jamais six avis concordants. Un Aniimo qu'aucune liste ne classe — les plus récents, la
  plupart des formes régionales — garde le score du calcul : c'est là que ce site sert à quelque
  chose. Le curseur de la vue <b>Réglages</b> permet de monter ce poids, ou de le ramener à zéro pour
  ne lire que le consensus.</p>
  <p>Ce mélange se vérifie. Chaque tier list est <b>mise de côté à tour de rôle</b>, les poids des
  autres sont réestimés sans elle, et on regarde à quel point l'indice retrouve son classement — c'est
  le tableau de la vue Réglages. L'indice final y devine chaque liste aussi bien, et le plus souvent
  mieux, que les cinq autres listes réunies. Comme les experts ne sont d'accord entre eux qu'à
  0,45–0,78, aucun classement ne peut viser 1,00 : qui annonce la tier list définitive se trompe sur
  ce qui est mesurable.</p>
  <p>Là où le calcul s'écarte du consensus, ce ne sont pas des erreurs à corriger mais des endroits à
  examiner, et le motif est net : les tier lists communautaires notent plus haut les DPS à burst
  conditionnel, plus bas les Break et les Support à grosses stats. C'est cohérent — elles jugent la
  facilité de jeu réelle, ce modèle juge le plafond à investissement maximal. Les deux réponses sont
  défendables, elles ne répondent simplement pas à la même question.</p>

  <h2>Dire ce qu'on ne sait pas : l'indice de confiance</h2>
  <p>Un palier obtenu d'un cheveu ne vaut pas un palier acquis. Chaque Aniimo est donc reclassé
  <b>${META.runs} fois</b>, chaque poids du modèle perturbé au hasard de ±25 % à chaque tirage. La
  part des tirages où il garde son palier donne sa pastille :</p>
  <ul>
    <li><i class="bd ok">&#10003;</i> <b>sûr</b> — garde son palier dans plus de 85 % des tirages,
      et au moins une tier list le classe. ${nconf("sur")} Aniimo.</li>
    <li><i class="bd warn">&#8776;</i> <b>probable</b> — entre 60 et 85 % : le palier est le bon
      pari, la frontière n'est pas loin. ${nconf("probable")} Aniimo.</li>
    <li><i class="bd bad">?</i> <b>incertain</b> — moins de 60 %, ou aucune tier list ne le classe.
      ${nconf("incertain")} Aniimo, à lire comme « quelque part entre ces deux paliers ».</li>
  </ul>
  <p>La fiche de chaque Aniimo montre la répartition complète de ses ${META.runs} tirages, et le
  constructeur d'équipe peut se limiter aux choix fiables. Ces pastilles sont mesurées aux poids de
  référence : elles ne suivent pas vos réglages.</p>

  <h2>Deux sorts à la fois, un seul objet</h2>
  <p>Un Aniimo n'emporte que <b>deux</b> sorts au combat — l'ultime, l'attaque de base et les traits,
  eux, restent acquis. La note de kit ne somme donc pas tout le kit : on cherche pour chaque Aniimo
  la <b>meilleure paire</b> au sens de son rôle, et c'est elle qui est notée. Les dégâts et le BREAK
  s'additionnent d'un sort à l'autre ; les autres axes se recouvrent, parce que deux sorts qui
  soignent ne soignent pas deux fois. La paire retenue est écrite sur chaque fiche, sous
  « à équiper ».</p>
  <p>Certains sorts ne valent leur place qu'entourés. <b>${Object.keys(META.lock).length} kits</b> ont
  leur apport collectif verrouillé sur un élément — un buff réservé, une résistance abaissée — et ne
  comptent plein que si un allié porte cet élément ; sinon le constructeur d'équipe leur fait équiper
  autre chose. <b>${META.duos.length} dépendances nommées</b>, lues dans les textes, suivent la même
  règle : un sort qui réclame le Gazon de Leafy ou les Rochers de Waleetle vaut moitié moins sans son
  fournisseur. La paire affichée dépend donc de l'équipe montée, pas d'un classement figé.</p>
  <p>Chaque Aniimo porte enfin <b>un objet</b>, un seul. La fiche propose celui de son rôle, ou le
  build publié de son espèce quand il en existe un ; dans une équipe, si deux membres visent le même
  exemplaire, le second prend son repli — le jeu ne dit pas clairement si un même objet peut être
  porté deux fois.</p>

  <h2>Le constructeur d'équipe</h2>
  <p>La note d'une équipe croise cinq termes : la puissance individuelle moyenne
  (${(TW.power*100).toFixed(0)} %), la couverture des six axes de kit (${(TW.axes*100).toFixed(0)} %),
  les éléments (${(TW.el*100).toFixed(0)} %), les rôles (${(TW.role*100).toFixed(0)} %) et les combos
  (${(TW.combo*100).toFixed(0)} %). Sur un axe, c'est le meilleur porteur qui compte, plus 40 % du
  second : la redondance aide, elle ne double pas l'effet.</p>
  <p>Les combos ne sont pas une heuristique : ce sont les verrous d'élément et les dépendances
  nommées de la section précédente, relus dans l'équipe montée. Quatre manques structurels retirent
  en plus des points directement : aucune source d'EP, aucun BREAK, aucune survie, ou un Pawney sans
  briseur pour lui ouvrir les cibles.</p>
  <p>Le bouton <b>Compléter</b> ne cherche pas les quatre meilleurs Aniimo : il cherche ce qui manque
  à ceux que vous avez déjà posés. Un membre marqué <b>gardé</b> n'est jamais remplacé ni proposé
  ailleurs — les suggestions se rangent autour de lui. Chaque changement conseillé est accompagné de
  ses raisons, ligne par ligne, pour qu'on puisse dire non en connaissance de cause.</p>

  <h2>Annoncés par le jeu, pas encore classés</h2>
  <p>Deux sources sont relevées : les fiches Game8, qui s'arrêtent au N° 083, et une base
  communautaire qui va plus loin. La seconde n'écrase jamais la première — elle ne fait
  qu'<b>ajouter</b> ce que Game8 n'a pas encore rédigé. ${META.attente.length} Aniimo sont
  annoncés sans que le jeu en publie de quoi les classer : ils sont nommés ici plutôt que
  devinés.</p>
  <table class="wait"><thead><tr><th>Aniimo</th><th>N°</th><th>Élément</th><th>Total</th>
  <th>Ce qui manque</th></tr></thead><tbody>
  ${META.attente.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.no||"—")}</td>
    <td>${a.el.length?a.el.map(esc).join(" / "):"—"}</td><td>${a.total||"—"}</td>
    <td>${a.manque.map(esc).join(", ")}</td></tr>`).join("")}
  </tbody></table>

  <h2>Limites connues</h2>
  <ul>
    <li><b>P.Déf est une valeur dérivée.</b> Le tableau Game8 duplique l'Attaque dans la cellule
      P.Déf — vérifié sur les 207 pages, sans une seule exception. Le Total de base étant correct,
      P.Déf est reconstruit par soustraction.</li>
    <li><b>Lunara</b> affiche ATQ 64 / P.Déf 116 pour un DPS, ce qui surprend. La seconde source
      annonce l'inverse (ATQ 116) — mais elle donne <b>la même ligne de statistiques à Lunara,
      Fennelun, Helion et Soleon</b>, et Game8 la dément pour les trois qu'il publie : elle ne sait
      donc rien de particulier sur Lunara, elle recopie. La valeur Game8 est conservée telle
      quelle, et la question reste ouverte.</li>
    <li><b>Soleon</b> est laissé de côté pour la même raison : sa seule fiche publiée porte cette
      ligne partagée. Game8, lui, affiche <code>??</code> partout sur sa page.</li>
    <li><b>Les formes régionales des nouveaux venus</b> n'ont pas de page à elles : seule la tuile
      de leur fiche de base dit ce qui change, à savoir leurs éléments. C'est donc tout ce qui leur
      est appliqué. Le report a été vérifié sur les 119 formes que les deux sources ont en
      commun : les éléments lus dans les tuiles coïncident avec Game8 <b>119 fois sur 119</b>.</li>
    <li>Le modèle ne mesure ni la vitesse d'animation, ni la portée, ni le confort de jeu.</li>
  </ul>
  </div>`;
}

/* ============================================================== modale == */
/* Objet tenu : un seul par Aniimo (aniimoguide.com/held-items). Par defaut l'objet
   du role (meilleur choix cite par les guides), sinon celui des builds Game8 de
   l'espece. alt : repli si deux membres voulaient le meme exemplaire. */
const ITEMS = {
  DPS:     {n:"Ferocious Fang", why:"+10 % Damage Amp et +0,7 ATK par niveau", alt:"Capacitous Battery"},
  Break:   {n:"Gargantuan Horn", why:"+10 % BREAK et +0,7 BREAK par niveau", alt:"Avenging Gear"},
  Support: {n:"Spirited Feather", why:"+10 % REGEN et +0,7 REGEN par niveau : ses sorts d'équipe tournent plus souvent", alt:"Auspicious Bell"},
  Regen:   {n:"Spirited Feather", why:"+10 % REGEN et +0,7 REGEN par niveau : plus d'EP pour toute l'équipe", alt:"Auspicious Bell"},
  Heal:    {n:"Miraculous Fleece", why:"+6 % soins, et le surplus de soin va à l'allié le plus bas", alt:"Heritage Amulet"},
};
const ITEM_KIT = [   // builds d'espece (Game8), la forme regionale ou Prismana herite
  ["Pawney", {n:"Echoing Grimoire", why:"+5 % par relance du même sort (5 cumuls) : Weakening Smash se relance trois fois", alt:"Ferocious Fang"}],
  ["Ignitis", {n:"Fission Needles", why:"50 % de chances de doubler chaque attaque de base", alt:"Ferocious Fang"}],
  ["Glynsera", {n:"Heartseeker Pendant", why:"+10 Might sur coup critique : Biting Wind donne +15 % de critique", alt:"Ferocious Fang"}],
  ["Fulmintis", {n:"Heartseeker Pendant", why:"+10 Might sur coup critique, pour son build axé critique", alt:"Ferocious Fang"}],
];
function itemFor(r){
  const k = ITEM_KIT.find(([f])=>r.name===f || r.name.endsWith(" "+f));
  return k ? Object.assign({src:"build Game8 de l'espèce"}, k[1])
    : Object.assign({src:"meilleur objet du rôle"}, ITEMS[r.role] || ITEMS.DPS);
}
/* Dans une equipe : si deux membres visent le meme objet, le second prend son repli
   (le jeu ne dit pas clairement si un meme objet peut etre porte deux fois). */
function teamItems(mem){
  const PRIO = {Regen:0, Heal:1, Support:2, Break:3, DPS:4}, used = new Set(), out = mem.map(()=>null);
  mem.map((r,i)=>i).filter(i=>mem[i])      // l'objet va d'abord au role qui en vit (Feather : le Regen)
    .sort((a,b)=>(PRIO[mem[a].role]??4)-(PRIO[mem[b].role]??4)).forEach(i=>{
      const it = itemFor(mem[i]), dup = used.has(it.n);
      used.add(dup ? it.alt : it.n);
      out[i] = dup ? {n:it.alt, why:"repli : "+it.n+" est déjà porté par un coéquipier (doublon non confirmé par le jeu)"} : it;
    });
  return out;
}
function itemHTML(r){
  const it = itemFor(r);
  return `<div class="note"><b>Objet conseillé :</b> ${esc(it.n)} — ${esc(it.why)}
    <span style="color:var(--tx3)">(${esc(it.src)} ; un seul objet par Aniimo, repli : ${esc(it.alt)})</span></div>`;
}
/* Deux sorts actifs a la fois : les axes affiches sont ceux de la paire conseillee
   (r.equip), le kit entier (r.axesAll) n'est jamais jouable d'un bloc. */
function skillsEquipFirst(r){
  const seen = new Set(), eq = r.equip||[];
  const u = r.skills.filter(s=>!seen.has(s.n) && seen.add(s.n));
  return u.map(s=>Object.assign({}, s, {eq: eq.length<u.length && eq.indexOf(s.n)>=0}))
    .sort((a,b)=>b.eq-a.eq);
}
function equipHTML(r){
  const eq = r.equip||[], n = new Set((r.skills||[]).map(s=>s.n)).size;
  if(n<=2) return "";
  const lost = AXES.filter(a=>r.axesAll && r.axesAll[a]-r.axes[a]>=.5);
  return `<div class="note"><b>À équiper :</b> ${eq.map(esc).join(" + ")}
    <span style="color:var(--tx3)">(${n} sorts, 2 à la fois)</span>${lost.length?`<br>Le reste du kit ne suit pas :
    ${lost.map(a=>`${ALAB[a]} ${r.axesAll[a]} → ${(+r.axes[a]).toFixed(1)}`).join(", ")}.`:""}${
    elVarsHTML(r, eq)}</div>`;
}
/* Paires de repli quand l'equipe n'a pas l'element que vise un sort */
function elVarsHTML(r, eq){
  if(!r.equipEl) return "";
  const all = [...new Set(Object.values(r.equipEl.locks))];
  const lab = v => v.need.length ? "Avec "+v.need.map(e=>"un allié "+ELAB[e]).join(" et ")
    : "Sans allié "+all.map(e=>ELAB[e]).join(" ni ");
  const cur = r.equipEl.vars.find(v=>v.equip.join()===eq.join());
  const alt = r.equipEl.vars.filter(v=>v!==cur);
  if(!alt.length || !cur) return "";
  return `<br>${Object.keys(r.equipEl.locks).map(esc).join(", ")} ne ${Object.keys(r.equipEl.locks).length>1?"servent":"sert"}
    que des alliés ${all.map(e=>ELAB[e]).join(" / ")}. Paire ci-dessus : ${esc(lab(cur).toLowerCase())}.
    ${alt.map(v=>`${lab(v)} : <b>${v.equip.map(esc).join(" + ")}</b>`).join(" ; ")}
    (le constructeur d'équipe choisit tout seul).`;
}

  ${r.innate&&r.innate.length?`<h3 style="font-size:13px;margin:18px 0 2px">Compétences innées</h3>${sk(r.innate)}`:""}

/* ============================================================== rendu === */
function render(){
  $("#nav").innerHTML = navHTML();
  $("#filters").innerHTML = filtersHTML();
  $("#view").innerHTML =
      S.view==="tier" ? viewTier() : S.view==="stats" ? viewStats()
    : S.view==="team" ? viewTeam() : S.view==="tune" ? viewTune() : viewMeth();
  const shown = ANIIMO.filter(pass).length;
  $("#count").textContent = S.view==="meth"
    ? `${ANIIMO.length} entrées · ${META.nKits} kits lus`
    : `${shown} sur ${ANIIMO.length} entrées`;
}

/* ============================================================ événements = */
document.addEventListener("click", function(e){
  const t = e.target;
  const nv = t.closest("#nav button");  if(nv){ S.view=nv.dataset.v; S.picking=-1; return render(); }
  const sk = t.closest("#segk button");
  if(sk){
    const k = sk.dataset.k, all = Object.keys(KINDS);
    if(k==="all") S.kinds = all.slice();
    else if(S.kinds.indexOf(k)<0) S.kinds = all.filter(x=>S.kinds.indexOf(x)>=0 || x===k);
    else if(S.kinds.length>1) S.kinds = S.kinds.filter(x=>x!==k);   // jamais de vivier vide
    return render();
  }

  if(t.closest("#cl") || t.id==="ov"){ $("#ov").classList.remove("on"); return; }

  if(t.id==="clearteam"){ S.team=[null,null,null,null]; S.lock=[false,false,false,false]; S.picking=-1; return render(); }
  if(t.id==="autoteam"){ build([0,1,2,3].filter(i=>S.lock[i] && S.team[i])); S.picking=-1; return render(); }
  if(t.id==="fillteam"){ build([0,1,2,3].filter(i=>S.team[i])); S.picking=-1; return render(); }
  const lk = t.closest("[data-lock]"); if(lk){ const i=+lk.dataset.lock; S.lock[i]=!S.lock[i]; return render(); }
  const sw = t.closest("[data-sw]");
  if(sw){ const p=sw.dataset.sw.split("|"); S.team[+p[0]]=byName[p.slice(1).join("|")]; return render(); }
  if(t.id==="cancelpick"){ S.picking=-1; return render(); }
  const rm = t.closest("[data-rm]"); if(rm){ S.team[+rm.dataset.rm]=null; S.lock[+rm.dataset.rm]=false; return render(); }
  const ad = t.closest("[data-add]"); if(ad){ S.picking=+ad.dataset.add; return render(); }

  if(t.id==="resetw"){ Object.assign(WS, clone(WS0)); recompute(WS); return render(); }

  const th = t.closest("th[data-s]");
  if(th){ const k=th.dataset.s; S.desc = (S.sort===k) ? !S.desc : true; S.sort=k; return render(); }

  const card = t.closest(".card, tbody tr");
  if(card && card.dataset.n){
    if(S.picking>=0 && S.view==="team"){
      S.team[S.picking] = byName[card.dataset.n]; S.lock[S.picking] = true;   // choisi a la main = impose
      S.picking=-1; return render();
    }
    return openModal(card.dataset.n);
  }
});
document.addEventListener("change", function(e){
  const t = e.target;
  if(t.id==="fr"){ S.role=t.value; return render(); }
  if(t.id==="fe"){ S.el=t.value; return render(); }
  if(t.id==="fs"){ S.stage=t.value; return render(); }
  if(t.id==="fh"){ S.hideSame=t.checked; return render(); }
  if(t.id==="fsafe"){ S.safe=t.checked; return render(); }
  if(t.id==="faround"){ S.around=t.checked; return render(); }
});
document.addEventListener("input", function(e){
  const t = e.target;
  if(t.id==="fq"){
    S.q = t.value; render();
    const q = $("#fq"); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
    return;
  }
  if(t.dataset && t.dataset.w){
    const parts = t.dataset.w.split("|"), grp = parts[0], key = parts[1], v = +t.value;
    let obj;
    if(grp==="Calcul"){
      WS.model = v; recompute(WS);
      t.parentNode.querySelector(".v").textContent = "×"+v.toFixed(2);
      const vb = $("#validbody"); if(vb) vb.innerHTML = validHTML();
      return;
    }
    if(grp==="Mélange")                   obj = WS.mix;
    else if(grp.indexOf("Stats ")===0)    obj = WS.stat[grp.slice(6)];
    else if(grp.indexOf("Kit ")===0)      obj = WS.kit[grp.slice(4)];
    else                                  obj = WS.give;
    obj[key] = v;
    recompute(WS);
    t.parentNode.querySelector(".v").textContent = (v*100).toFixed(0)+"%";
    const s = $("#sum-"+grpId(grp));
    if(s) s.textContent = Object.keys(obj).reduce((a,k)=>a+obj[k],0).toFixed(2);
    const vb = $("#validbody"); if(vb) vb.innerHTML = validHTML();
    return;
  }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape") $("#ov").classList.remove("on");
});

/* ------------------------------------------------------------- jour/nuit -- */
/* Le parchemin par defaut, la veillee au coin du feu en option. Le choix est
   garde dans le navigateur ; sans choix, on suit le reglage du systeme. */
const themeBtn = $("#theme");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t==="nuit" ? "\u{1F319}" : "\u2600\uFE0F";
  themeBtn.setAttribute("aria-label", t==="nuit" ? "Passer en clair" : "Passer en sombre");
  try{ localStorage.setItem("amoTheme", t); }catch(e){}
}
let theme0 = null;
try{ theme0 = localStorage.getItem("amoTheme"); }catch(e){}
/* matchMedia manque a certains environnements (le banc d'essai jsdom) :
   sans garde, toute la suite du script tomberait avec lui. */
let sombre = false;
try{ sombre = window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
setTheme(theme0 || (sombre ? "nuit" : "jour"));
themeBtn.addEventListener("click", function(){
  setTheme(document.documentElement.getAttribute("data-theme")==="nuit" ? "jour" : "nuit");
});

recompute(WS);
render();
</script>
</body>
</html>
